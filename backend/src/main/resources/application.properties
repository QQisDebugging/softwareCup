spring.application.name=software-cup-learning-backend
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.datasource.url=jdbc:h2:file:./data/softwarecup;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=80MB

softwarecup.storage.root=uploads
softwarecup.agent.resource-base-url=${SOFTWARECUP_AGENT_RESOURCE_BASE_URL:http://localhost:9001}
softwarecup.agent.provider=${SOFTWARECUP_AGENT_PROVIDER:${RESOURCE_AGENT_PROVIDER:offline}}
softwarecup.agent.model=${SOFTWARECUP_AGENT_MODEL:${SOFTWARECUP_MODEL_NAME:offline-resource-agent}}
softwarecup.agent.fallback-provider=local-rule-engine
softwarecup.agent.fallback-model=deterministic-template-v1
softwarecup.agent.connect-timeout-ms=3000
softwarecup.agent.read-timeout-ms=30000

management.endpoints.web.exposure.include=health,info
