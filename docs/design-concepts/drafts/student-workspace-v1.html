<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智学工坊学生端效果图 v1</title>
    <style>
      :root {
        --bg: #edf2f7;
        --ink: #102033;
        --muted: #64758a;
        --line: #dce7ee;
        --line-strong: #c7d7e0;
        --surface: #ffffff;
        --surface-soft: #f6fbfc;
        --teal: #0f8d83;
        --teal-strong: #087f79;
        --teal-soft: #e7f7f4;
        --navy: #071522;
        --shadow: 0 22px 56px rgba(15, 23, 42, 0.12);
        font-family:
          Inter, "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei",
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-size: 16px;
      }

      .desktop {
        height: 100vh;
        padding: 28px;
      }

      .frame {
        display: grid;
        grid-template-columns: 326px minmax(0, 1fr);
        height: calc(100vh - 56px);
        overflow: hidden;
        background: #fff;
        border: 1px solid rgba(148, 163, 184, 0.32);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .sidebar {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 34px 28px 24px;
        overflow: hidden;
        color: #e8f3f5;
        background:
          linear-gradient(180deg, rgba(4, 16, 27, 0.96), rgba(4, 16, 27, 0.87)),
          linear-gradient(90deg, rgba(20, 184, 166, 0.14), transparent 46%),
          url("../../../frontend/src/assets/learning-platform-hero.png") center / cover no-repeat;
      }

      .sidebar::before {
        content: "";
        position: absolute;
        top: 116px;
        bottom: 104px;
        left: 34px;
        width: 1px;
        background: rgba(255, 255, 255, 0.18);
      }

      .sidebar-resize-hint {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 7px;
        background:
          linear-gradient(180deg, transparent, rgba(20, 184, 166, 0.42), transparent);
        opacity: 0.72;
      }

      .brand {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        color: #fff;
      }

      .brand img {
        width: 44px;
        height: 44px;
        object-fit: cover;
        background: rgba(255, 255, 255, 0.94);
        border-radius: 10px;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.22);
      }

      .brand strong,
      .brand span {
        display: block;
      }

      .brand strong {
        font-size: 23px;
        font-weight: 860;
        line-height: 1.1;
      }

      .brand span {
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.68);
        font-size: 13px;
      }

      .nav {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 8px;
        margin-top: 42px;
      }

      .nav-item {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: center;
        min-height: 52px;
        padding: 0 14px;
        color: rgba(232, 243, 245, 0.76);
        border-radius: 9px;
        font-size: 15px;
        font-weight: 680;
      }

      .nav-item.active {
        color: #fff;
        background: linear-gradient(90deg, rgba(20, 184, 166, 0.36), rgba(20, 184, 166, 0.12));
        box-shadow: inset 3px 0 0 #18c7b6;
      }

      .nav-icon,
      .mini-icon {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
      }

      .nav-icon svg,
      .mini-icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .course-dock {
        position: relative;
        z-index: 3;
        margin-top: auto;
      }

      .course-trigger {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 20px;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 70px;
        padding: 12px;
        color: #fff;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.16);
        backdrop-filter: blur(10px);
      }

      .course-cover {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 9px;
      }

      .course-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .course-copy {
        min-width: 0;
      }

      .course-copy strong,
      .course-copy span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .course-copy strong {
        font-size: 14px;
        font-weight: 800;
      }

      .course-copy span {
        margin-top: 3px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 12px;
      }

      .course-menu {
        position: absolute;
        left: -2px;
        bottom: 88px;
        display: none;
        width: 392px;
        padding: 16px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 28px 70px rgba(15, 23, 42, 0.2);
      }

      .course-menu::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 42px;
        width: 14px;
        height: 14px;
        background: rgba(255, 255, 255, 0.98);
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        transform: rotate(45deg);
      }

      body[data-screen="course-switch"] .course-menu {
        display: block;
      }

      .course-menu h3 {
        margin: 2px 2px 12px;
        font-size: 16px;
      }

      .course-group {
        margin-top: 12px;
      }

      .course-group-title {
        display: flex;
        justify-content: space-between;
        margin: 0 2px 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
      }

      .course-option {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        min-height: 56px;
        padding: 10px;
        border-radius: 9px;
      }

      .course-option.active {
        background: var(--teal-soft);
        outline: 1px solid rgba(15, 141, 131, 0.24);
      }

      .course-option strong,
      .course-option span {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .course-option strong {
        font-size: 14px;
      }

      .course-option span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        height: 23px;
        padding: 0 8px;
        color: var(--teal-strong);
        background: #e8f8f6;
        border: 1px solid rgba(15, 141, 131, 0.18);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 760;
        white-space: nowrap;
      }

      .main {
        display: grid;
        grid-template-rows: 92px minmax(0, 1fr);
        min-width: 0;
        background:
          radial-gradient(circle at 88% 0%, rgba(20, 184, 166, 0.07), transparent 28%),
          #fbfdfe;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 0 48px 0 44px;
        border-bottom: 1px solid var(--line);
      }

      .page-title h1 {
        margin: 0;
        color: var(--ink);
        font-size: 30px;
        font-weight: 860;
        line-height: 1.1;
      }

      .page-title p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      .account-zone {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .circle-button {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        color: #486174;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
      }

      .account-chip {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 18px;
        gap: 10px;
        align-items: center;
        min-width: 186px;
        min-height: 48px;
        padding: 4px 12px 4px 4px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        color: #fff;
        background: linear-gradient(180deg, #0f9f92, #087f79);
        border-radius: 999px;
        font-weight: 850;
      }

      .account-chip strong,
      .account-chip span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .account-chip strong {
        font-size: 14px;
      }

      .account-chip span {
        margin-top: 1px;
        color: var(--muted);
        font-size: 12px;
      }

      .content {
        min-width: 0;
        overflow: hidden;
        padding: 30px 44px 34px;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(360px, 0.75fr);
        gap: 24px;
        height: 100%;
      }

      .stack {
        display: grid;
        align-content: start;
        gap: 22px;
        min-width: 0;
      }

      .panel {
        min-width: 0;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.04);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 64px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h2 {
        margin: 0;
        font-size: 21px;
        font-weight: 860;
      }

      .panel-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        color: var(--teal-strong);
        background: #fff;
        border: 1px solid rgba(15, 141, 131, 0.26);
        border-radius: 8px;
        font-size: 14px;
        font-weight: 800;
      }

      .button.primary {
        color: #fff;
        background: var(--teal-strong);
        border-color: var(--teal-strong);
      }

      .summary-strip {
        display: grid;
        grid-template-columns: minmax(330px, 1.25fr) repeat(4, minmax(140px, 0.55fr));
        min-height: 152px;
        overflow: hidden;
      }

      .summary-cell {
        display: grid;
        align-content: center;
        gap: 8px;
        min-width: 0;
        padding: 20px 24px;
        border-right: 1px solid var(--line);
      }

      .summary-cell:last-child {
        border-right: 0;
      }

      .summary-cell label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 760;
      }

      .summary-cell strong {
        overflow: hidden;
        color: var(--ink);
        font-size: 24px;
        font-weight: 880;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .summary-cell p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .progress-bar {
        width: 100%;
        height: 7px;
        overflow: hidden;
        background: #e2eaef;
        border-radius: 999px;
      }

      .progress-bar i {
        display: block;
        width: 66%;
        height: 100%;
        background: linear-gradient(90deg, #2563eb, var(--teal));
      }

      .action-ribbon {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) repeat(3, minmax(220px, 0.72fr));
        gap: 16px;
        padding: 20px;
      }

      .action-main,
      .action-mini {
        display: grid;
        align-content: center;
        min-height: 104px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: linear-gradient(180deg, #fff, #f8fcfd);
      }

      .action-main {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        background: linear-gradient(90deg, #effbfa, #fff);
        border-color: rgba(15, 141, 131, 0.22);
      }

      .action-main h3,
      .action-mini h3 {
        margin: 0;
        font-size: 17px;
        font-weight: 850;
      }

      .action-main p,
      .action-mini p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .learning-map {
        padding: 26px 28px 30px;
      }

      .stage-line {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        position: relative;
        margin-bottom: 26px;
      }

      .stage-line::before {
        content: "";
        position: absolute;
        top: 39px;
        right: 9%;
        left: 9%;
        height: 3px;
        background: #dce7ee;
      }

      .stage {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .stage span {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        color: #789;
        background: #fff;
        border: 2px solid #d7e4ec;
        border-radius: 999px;
        font-weight: 850;
      }

      .stage.done,
      .stage.current {
        color: var(--teal-strong);
        font-weight: 820;
      }

      .stage.done span,
      .stage.current span {
        color: #fff;
        background: var(--teal-strong);
        border-color: var(--teal-strong);
      }

      .module-list {
        display: grid;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }

      .module-row {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        min-height: 82px;
        padding: 14px 18px;
        background: #fbfdfe;
        border-bottom: 1px solid var(--line);
      }

      .module-row:last-child {
        border-bottom: 0;
      }

      .module-row.active {
        background: #effbfa;
        box-shadow: inset 3px 0 0 var(--teal-strong);
      }

      .step-no {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        color: var(--teal-strong);
        background: #dff5f1;
        border: 1px solid rgba(15, 141, 131, 0.26);
        border-radius: 8px;
        font-weight: 850;
      }

      .module-row h3 {
        margin: 0;
        font-size: 17px;
      }

      .module-row p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .ai-panel {
        display: grid;
        gap: 14px;
        padding: 20px;
      }

      .prompt {
        padding: 14px;
        color: #526477;
        background: #f8fbfc;
        border: 1px solid var(--line);
        border-radius: 9px;
        line-height: 1.55;
      }

      .prompt strong {
        display: block;
        margin-bottom: 8px;
        color: var(--ink);
      }

      .question-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font-weight: 760;
      }

      .course-board {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        gap: 22px;
        height: 100%;
      }

      .course-list {
        display: grid;
        gap: 12px;
        padding: 20px;
      }

      .course-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        min-height: 112px;
        padding: 18px;
        background: #fbfdfe;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .course-card.active {
        background: #effbfa;
        border-color: rgba(15, 141, 131, 0.28);
      }

      .course-card h3 {
        margin: 0;
        font-size: 19px;
      }

      .course-card p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .source-line {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .builder-layout {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
        gap: 24px;
        height: 100%;
      }

      .upload-zone {
        display: grid;
        align-content: center;
        justify-items: center;
        min-height: 300px;
        margin: 20px;
        padding: 34px;
        text-align: center;
        background:
          linear-gradient(180deg, rgba(240, 251, 249, 0.84), rgba(255, 255, 255, 0.92)),
          repeating-linear-gradient(135deg, transparent 0 18px, rgba(15, 141, 131, 0.04) 18px 19px);
        border: 1px dashed rgba(15, 141, 131, 0.42);
        border-radius: 12px;
      }

      .upload-zone h2 {
        margin: 16px 0 8px;
        font-size: 25px;
      }

      .upload-zone p {
        margin: 0;
        color: var(--muted);
      }

      .pipeline {
        display: grid;
        gap: 14px;
        padding: 20px;
      }

      .pipe-step {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        min-height: 74px;
        padding: 14px;
        background: #fbfdfe;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .profile-layout {
        display: grid;
        grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
        gap: 24px;
        height: 100%;
      }

      .radar {
        display: grid;
        place-items: center;
        min-height: 470px;
        margin: 20px;
        background: radial-gradient(circle, rgba(15, 141, 131, 0.12) 0 34%, transparent 35%),
          radial-gradient(circle, transparent 0 54%, rgba(15, 141, 131, 0.12) 55% 56%, transparent 57%),
          #fbfdfe;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .radar-core {
        display: grid;
        place-items: center;
        width: 190px;
        height: 190px;
        color: #fff;
        text-align: center;
        background: linear-gradient(180deg, #12a89a, #087f79);
        border-radius: 999px;
        box-shadow: 0 22px 58px rgba(15, 141, 131, 0.24);
      }

      .radar-core strong {
        display: block;
        font-size: 38px;
      }

      .insight-list {
        display: grid;
        gap: 14px;
        padding: 20px;
      }

      .insight {
        padding: 16px;
        background: #fbfdfe;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .insight h3 {
        margin: 0;
        font-size: 17px;
      }

      .insight p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .generation-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 24px;
        height: 100%;
      }

      .composer {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 0;
      }

      .compose-body {
        display: grid;
        align-content: start;
        gap: 14px;
        padding: 20px;
        overflow: hidden;
      }

      .template-row {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        min-height: 72px;
        padding: 14px;
        background: #fbfdfe;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .prompt-box {
        min-height: 170px;
        padding: 18px;
        color: #536679;
        background: #f8fbfc;
        border: 1px solid var(--line);
        border-radius: 10px;
        line-height: 1.7;
      }

      .chat-layout {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr) 390px;
        gap: 22px;
        height: 100%;
      }

      .chat-main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 0;
      }

      .messages {
        display: grid;
        align-content: start;
        gap: 16px;
        padding: 22px;
        overflow: hidden;
      }

      .message {
        max-width: 78%;
        padding: 14px 16px;
        border-radius: 12px;
        line-height: 1.7;
      }

      .message.assistant {
        background: #f3faf9;
        border: 1px solid rgba(15, 141, 131, 0.17);
      }

      .message.user {
        justify-self: end;
        color: #fff;
        background: var(--teal-strong);
      }

      .chat-input {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        padding: 18px;
        border-top: 1px solid var(--line);
      }

      .chat-input input {
        height: 48px;
        padding: 0 16px;
        background: #f8fbfc;
        border: 1px solid var(--line);
        border-radius: 9px;
        outline: 0;
      }

      .compact-list {
        display: grid;
        gap: 10px;

    <script>
      const iconSvg = {
        home: '<svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5v7a1.5 1.5 0 0 1-1.5 1.5H15v-5H9v5H5.5A1.5 1.5 0 0 1 4 18.5z"/></svg>',
        book: '<svg viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H20v16H7.5A2.5 2.5 0 0 0 5 21z"/><path d="M5 5.5V21M9 7h7M9 11h6"/></svg>',
        spark: '<svg viewBox="0 0 24 24"><path d="m12 3 1.7 5.1L19 10l-5.3 1.9L12 17l-1.7-5.1L5 10l5.3-1.9z"/><path d="m18 15 .9 2.5 2.6.9-2.6.9L18 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>',
        brain: '<svg viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3v.5A3.5 3.5 0 0 0 4 14a4 4 0 0 0 4 4h1V4z"/><path d="M15 4a3 3 0 0 1 3 3v.5A3.5 3.5 0 0 1 20 14a4 4 0 0 1-4 4h-1V4z"/><path d="M9 9H7M15 9h2M9 14H7M15 14h2"/></svg>',
        route: '<svg viewBox="0 0 24 24"><path d="M6 6h.01M18 18h.01"/><path d="M6 6c5 0 3 6 8 6s3 6 4 6"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/></svg>',
        bot: '<svg viewBox="0 0 24 24"><path d="M12 5V3M7 8h10a3 3 0 0 1 3 3v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-5a3 3 0 0 1 3-3z"/><path d="M9 13h.01M15 13h.01M9 17h6"/></svg>',
        chevron: '<svg viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg>',
        bell: '<svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>',
        check: '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
      };

      const nav = [
        ["dashboard", "我的学习", "home"],
        ["courses", "我的课程", "book"],
        ["builder", "自定义课程", "spark"],
        ["profiles", "学习画像", "brain"],
        ["generation", "资源生成", "route"],
        ["learning", "AI 助教", "bot"],
      ];

      const meta = {
        dashboard: ["我的学习", "围绕当前课程继续学习，课程切换只在左下角完成"],
        "course-switch": ["我的学习", "左下角课程切换展开：区分班级发放课程与自建课程"],
        courses: ["我的课程", "课程按来源管理：进入班级获得课程，上传资料生成自建课程"],
        builder: ["自定义课程", "上传 PPT、教材或笔记，生成自己的课程结构和学习路径"],
        profiles: ["学习画像", "把学习行为、答疑记录和测评结果沉淀成可解释画像"],
        generation: ["资源生成", "按当前课程和任务生成讲义、题目、案例与复习材料"],
        learning: ["AI 助教", "聊天是主入口，围绕当前课程、当前任务和我的薄弱点回答"],
      };

      const screen = new URLSearchParams(location.search).get("screen") || "dashboard";
      const active = screen === "course-switch" ? "dashboard" : screen;
      document.body.dataset.screen = screen;
      document.getElementById("pageTitle").textContent = meta[screen][0];
      document.getElementById("pageSubtitle").textContent = meta[screen][1];
      document.getElementById("nav").innerHTML = nav
        .map(([key, label, icon]) => `<div class="nav-item ${key === active ? "active" : ""}"><span class="nav-icon">${iconSvg[icon]}</span><span>${label}</span></div>`)
        .join("");

      function summaryStrip() {
        return `<section class="panel summary-strip">
          <div class="summary-cell"><label>当前课程</label><strong>AI 个性化学习智能体实践</strong><p>人工智能与教学实训 · 48 学时</p></div>
          <div class="summary-cell"><label>学习进度</label><strong>66%</strong><div class="progress-bar"><i></i></div><p>31.5 / 48 学时</p></div>
          <div class="summary-cell"><label>学习资源</label><strong>1 个</strong><p>待完成资源</p></div>
          <div class="summary-cell"><label>学习记录</label><strong>3 条</strong><p>累计 21 分钟</p></div>
          <div class="summary-cell"><label>学情状态</label><strong>良好</strong><p>建议补齐资源生成流程</p></div>
        </section>`;
      }

      function dashboard() {
        return `<div class="stack">
          ${summaryStrip()}
          <section class="panel">
            <div class="panel-head"><div><h2>接下来继续学习</h2><p>当前课程切换后，这里的路径和任务会同步更新</p></div><button class="button primary">继续学习</button></div>
            <div class="action-ribbon">
              <div class="action-main"><div><h3>对话式学习画像构建</h3><p>课程讲解文档 / 画像诊断到资源生成流程说明</p></div><span class="tag">导学 · 18 分钟</span></div>
              <div class="action-mini"><h3>智能答疑</h3><p>2 个未读回复</p></div>
              <div class="action-mini"><h3>学习任务</h3><p>3 个任务待完成</p></div>
              <div class="action-mini"><h3>学习资源</h3><p>1 个资源待学习</p></div>
            </div>
          </section>
          <div class="content-grid">
            <section class="panel learning-map">
              <div class="panel-head" style="padding:0 0 18px;border-bottom:0;min-height:auto"><div><h2>学习地图</h2><p>以模块阶段替代堆叠卡片，重点显示当前节点</p></div><button class="button">查看全部任务</button></div>
              <div class="stage-line">
                <div class="stage done"><span>1</span><strong>画像构建</strong></div>
                <div class="stage done"><span>2</span><strong>资源生成</strong></div>
                <div class="stage current"><span>3</span><strong>资源推送</strong></div>
                <div class="stage"><span>4</span><strong>效果评估</strong></div>
              </div>
              <div class="module-list">
                <div class="module-row"><span class="step-no">1</span><div><h3>综合题表达与证据引用</h3><p>练习 · 20 分钟 · 已完成</p></div><span class="tag">已完成</span></div>
                <div class="module-row active"><span class="step-no">2</span><div><h3>课程项目综合任务</h3><p>项目 · 35 分钟 · 正在进行</p></div><span class="tag">进行中</span></div>
                <div class="module-row"><span class="step-no">3</span><div><h3>量化评估方法与工具</h3><p>讲解 · 20 分钟 · 未开始</p></div><span class="tag">待解锁</span></div>
                <div class="module-row"><span class="step-no">4</span><div><h3>阶段小结与测验</h3><p>测验 · 15 分钟 · 未开始</p></div><span class="tag">待解锁</span></div>
              </div>
            </section>
            <section class="panel">
              <div class="panel-head"><div><h2>AI 助教</h2><p>围绕当前课程给下一步</p></div></div>
              <div class="ai-panel">
                <div class="prompt"><strong>你的学习伙伴</strong>有问题随时问我，我会根据你的学习情况提供个性化解释和建议。</div>
                <div class="question-row">这节课的重点是什么？<span class="mini-icon" data-icon="chevron"></span></div>
                <div class="question-row">如何完成课程项目任务？<span class="mini-icon" data-icon="chevron"></span></div>
                <div class="question-row">推荐相关学习资源<span class="mini-icon" data-icon="chevron"></span></div>
                <button class="button primary" style="width:100%;margin-top:4px">向 AI 助教提问</button>
              </div>
            </section>
          </div>
        </div>`;
      }

      function courses() {
        return `<div class="course-board">
          <section class="panel">
            <div class="panel-head"><div><h2>班级发放课程</h2><p>来源：进入班级后由教师统一发放</p></div><button class="button">输入班级码</button></div>
            <div class="course-list">
              <div class="course-card active"><div><h3>AI 个性化学习智能体实践</h3><p>老师发放 · 人工智能与教学实训 · 当前课程</p><div class="source-line"><span class="tag">班级课程</span><span class="tag">48 学时</span><span class="tag">66%</span></div></div><button class="button primary">进入学习</button></div>
              <div class="course-card"><div><h3>Java Web 应用开发与软件工程实践</h3><p>老师发放 · 计算机科学与技术 · 课程任务 4 个</p><div class="source-line"><span class="tag">班级课程</span><span class="tag">48 学时</span></div></div><button class="button">设为当前</button></div>
              <div class="course-card"><div><h3>工程实践与项目开发</h3><p>老师发放 · 项目制课程与工程训练 · 小组任务已同步</p><div class="source-line"><span class="tag">班级课程</span><span class="tag">64 学时</span></div></div><button class="button">设为当前</button></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-head"><div><h2>我的自建课程</h2><p>来源：上传资料后由智能体生成</p></div><button class="button primary">新建课程</button></div>
            <div class="course-list">
              <div class="course-card"><div><h3>大学计算机基础自适应训练</h3><p>由 PPT、教材片段和错题记录生成，可继续补充资料</p><div class="source-line"><span class="tag">自建课程</span><span class="tag">32 学时</span></div></div><button class="button">管理</button></div>
              <div class="course-card"><div><h3>模板槽位</h3><p>这里保留通用模板，不绑定某一门演示课程。</p><div class="source-line"><span class="tag">待生成</span></div></div><button class="button">上传资料</button></div>
            </div>
          </section>
        </div>`;
      }

      function builder() {
        return `<div class="builder-layout">
          <section class="panel">
            <div class="panel-head"><div><h2>上传资料生成课程</h2><p>这里是自建课程入口，不和已有课程列表混在一起</p></div></div>
            <div class="upload-zone"><span class="mini-icon" data-icon="spark" style="width:54px;height:54px;color:#087f79"></span><h2>拖入 PPT、教材、笔记或题库</h2><p>智能体会抽取章节、知识点、任务和测评模板，生成可继续编辑的课程草案。</p><button class="button primary" style="margin-top:24px">选择文件</button></div>
          </section>
          <section class="panel">
            <div class="panel-head"><div><h2>课程生成编排</h2><p>保留通用模板槽位，避免看起来像写死样例</p></div></div>
            <div class="pipeline">
              <div class="pipe-step"><span class="step-no">1</span><div><strong>资料解析</strong><p>识别目录、主题、公式、案例和图片说明</p></div><span class="tag">自动</span></div>
              <div class="pipe-step"><span class="step-no">2</span><div><strong>课程结构</strong><p>生成模块、课时、目标、前置知识和任务模板</p></div><span class="tag">可编辑</span></div>
              <div class="pipe-step"><span class="step-no">3</span><div><strong>资源生成</strong><p>讲义、练习、答疑卡、测评题和项目说明分开生成</p></div><span class="tag">讯飞</span></div>
              <div class="pipe-step"><span class="step-no">4</span><div><strong>发布到我的课程</strong><p>生成后进入“我的自建课程”，不会覆盖老师发放课程</p></div><span class="tag">确认后</span></div>
            </div>
          </section>
        </div>`;
      }

      function profiles() {
        return `<div class="profile-layout">
          <section class="panel">
            <div class="panel-head"><div><h2>学习画像总览</h2><p>按当前课程聚合，切课后画像同步切换</p></div></div>
            <div class="radar"><div class="radar-core"><div><strong>66%</strong><span>当前掌握度</span></div></div></div>
          </section>
          <section class="panel">
            <div class="panel-head"><div><h2>可解释诊断</h2><p>学生看到的是“我该怎么补”，不是第三视角评价</p></div><button class="button">生成补齐路径</button></div>
            <div class="insight-list">
              <div class="insight"><h3>强项：概念识别</h3><p>能够准确识别画像构建、资源推送等核心概念，适合进入项目任务。</p></div>
              <div class="insight"><h3>薄弱点：效果评估</h3><p>对评估指标与动态调整的联系还不稳定，建议先完成一组短测。</p></div>
              <div class="insight"><h3>学习行为</h3><p>最近 3 次学习都集中在导学材料，AI 建议增加一次问答和一次练习。</p></div>
              <div class="insight"><h3>下一步</h3><p>先补“量化评估方法与工具”，再进入阶段小结与测验。</p></div>
            </div>
          </section>
        </div>`;
      }

      function generation() {
        return `<div class="generation-layout">
          <section class="panel composer">
            <div class="panel-head"><div><h2>资源生成工作台</h2><p>以交互式生成代替静态表格，结果归属于当前课程</p></div><button class="button primary">开始生成</button></div>
            <div class="compose-body">
              <div class="template-row"><span class="step-no">1</span><div><strong>选择资源类型</strong><p>讲义、题目、案例、项目说明、复习卡片</p></div><span class="tag">模板</span></div>
              <div class="template-row"><span class="step-no">2</span><div><strong>绑定课程节点</strong><p>当前：资源推送与效果评估 / 课程项目综合任务</p></div><span class="tag">当前课程</span></div>
              <div class="template-row"><span class="step-no">3</span><div><strong>生成约束</strong><p>难度、题型、页数、知识点覆盖率、是否需要答案解析</p></div><span class="tag">可调整</span></div>
              <div class="prompt-box">给当前课程的“课程项目综合任务”生成一份练习资源。要求包含任务背景、步骤提示、3 道检查题和一段可直接提交给 AI 助教追问的提示词。</div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-head"><div><h2>生成记录</h2><p>保留不同样例，避免像写死演示</p></div></div>
            <div class="compact-list">
              <div class="compact-row"><strong>讲义摘要</strong><span>面向导学节点 · 已生成 6 页</span></div>
              <div class="compact-row"><strong>练习题组</strong><span>面向效果评估 · 5 题含解析</span></div>
              <div class="compact-row"><strong>项目说明</strong><span>面向课程项目综合任务 · 待完善</span></div>
              <div class="compact-row"><strong>模板槽位</strong><span>用于下一门课程生成，不绑定当前样例</span></div>
            </div>
          </section>
        </div>`;
      }

      function learning() {
        return `<div class="chat-layout">
          <section class="panel">
            <div class="panel-head"><div><h2>当前上下文</h2><p>AI 回答只围绕当前课程和任务</p></div></div>
            <div class="compact-list">
              <div class="compact-row"><strong>课程</strong><span>AI 个性化学习智能体实践</span></div>
              <div class="compact-row"><strong>任务</strong><span>课程项目综合任务 · 正在进行</span></div>
              <div class="compact-row"><strong>薄弱点</strong><span>效果评估指标、动态调整流程</span></div>
              <div class="compact-row"><strong>资料</strong><span>课程讲义、练习题组、项目说明</span></div>
            </div>
          </section>

            <div class="messages">
              <div class="message assistant">我已经读取当前课程节点。你现在卡在“课程项目综合任务”，建议先明确评估指标，再写资源推送流程。</div>
              <div class="message user">我不太懂效果评估和动态调整有什么关系。</div>
              <div class="message assistant">可以这样理解：效果评估是观察学习资源是否真的有效，动态调整是根据评估结果修改下一次推荐。你可以用“学习完成率、答题正确率、追问次数”作为三个基础指标。</div>
              <div class="message user">那项目报告里应该怎么写？</div>
              <div class="message assistant">建议写成三步：先定义指标，再记录本轮学习表现，最后说明系统如何根据指标调整下一轮资源。这样评委能看出智能体不是单次生成，而是在闭环优化。</div>
              <div class="message assistant">我也可以直接帮你生成一段“项目报告表述”，并附一个可复用的评价表格。</div>
            </div>
            <div class="chat-input"><input value="继续问：帮我把这个解释成项目报告里的表述" /><button class="button primary">发送</button></div>
          </section>
          <section class="panel">
            <div class="panel-head"><div><h2>可引用材料</h2><p>回答可以插入到学习记录</p></div></div>
            <div class="compact-list">
              <div class="compact-row"><strong>课程讲义片段</strong><span>资源推送与效果评估的流程说明</span></div>
              <div class="compact-row"><strong>错题关联</strong><span>第 3 题：评价指标选择不完整</span></div>

            </div>
          </section>
        </div>`;
      }

      const render = {
        dashboard,
        "course-switch": dashboard,
        courses,
        builder,
        profiles,
        generation,
        learning,

      document.getElementById("content").innerHTML = render[screen]();
      document.querySelectorAll("[data-icon]").forEach((el) => {
