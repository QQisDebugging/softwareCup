<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智学工坊学生端效果图 v2</title>
    <style>
      :root {
        --bg: #eef3f7;
        --paper: #ffffff;
        --soft: #f7fbfc;
        --soft-2: #eef8f7;
        --ink: #111d31;
        --text: #26364d;
        --muted: #68798e;
        --line: #dce7ef;
        --line-2: #cbdbe5;
        --teal: #07877e;
        --teal-2: #0ea69a;
        --green: #35a86b;
        --blue: #2868d8;
        --amber: #df8736;
        --red: #d95e63;
        --shadow: 0 16px 38px rgba(23, 39, 61, 0.08);
        --side: 314px;
        --top: 88px;
        font-family:
          Inter, "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei",
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-size: 16px;
        letter-spacing: 0;
      }

      .desktop { height: 100vh; padding: 16px; }
      .frame {
        display: grid;
        grid-template-columns: var(--side) minmax(0, 1fr);
        height: calc(100vh - 32px);
        overflow: hidden;
        background: var(--paper);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 14px;
        box-shadow: 0 22px 60px rgba(15, 23, 42, 0.12);
      }

      .sidebar {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 24px 18px 18px;
        background:
          linear-gradient(180deg, rgba(255,255,255,.94), rgba(247,252,253,.96)),
          radial-gradient(circle at 12% 0, rgba(14,166,154,.13), transparent 34%);
        border-right: 1px solid var(--line);
      }
      .resizer {
        position: absolute;
        top: 0;
        right: -5px;
        z-index: 8;
        display: grid;
        place-items: center;
        width: 10px;
        height: 100%;
      }
      .resizer::before {
        content: "";
        width: 3px;
        height: 42px;
        border-radius: 999px;
        background: #b6c7d3;
        box-shadow: 0 0 0 5px #fff;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        padding: 0 8px 18px;
      }
      .brand img {
        width: 43px;
        height: 43px;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 10px 22px rgba(14, 166, 154, 0.12);
      }
      .brand strong, .brand span { display: block; }
      .brand strong {
        color: var(--ink);
        font-size: 22px;
        font-weight: 880;
        line-height: 1.1;
      }
      .brand span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .nav { display: grid; gap: 8px; margin-top: 12px; }
      .nav-item {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: center;
        min-height: 48px;
        padding: 0 13px;
        color: #34475d;
        border: 1px solid transparent;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 720;
      }
      .nav-item.active {
        color: var(--teal);
        background: linear-gradient(90deg, #e7f8f5, #f4fbfb);
        border-color: rgba(14, 166, 154, 0.28);
        box-shadow: inset 3px 0 0 var(--teal);
      }
      .icon { display: grid; place-items: center; color: currentColor; }
      .icon svg {
        width: 20px; height: 20px; fill: none; stroke: currentColor;
        stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
      }

      .course-dock {
        position: relative;
        display: grid;
        gap: 9px;
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .dock-title {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
      }
      .course-trigger, .mini-account {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 22px;
        gap: 11px;
        align-items: center;
        min-height: 68px;
        padding: 11px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .course-trigger {
        background: linear-gradient(90deg, #eaf8f6, #fff);
        border-color: rgba(14, 166, 154, 0.42);
        box-shadow: 0 10px 24px rgba(14, 166, 154, 0.1);
      }
      .mark, .avatar {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        color: #fff;
        background: linear-gradient(180deg, var(--teal-2), var(--teal));
        border-radius: 9px;
        font-weight: 860;
      }
      .mark img {
        width: 100%; height: 100%; object-fit: cover; border-radius: 9px;
      }
      .course-trigger strong, .course-trigger span, .mini-account strong, .mini-account span {
        display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .course-trigger strong, .mini-account strong { color: var(--ink); font-size: 15px; font-weight: 850; }
      .course-trigger span, .mini-account span { margin-top: 3px; color: var(--muted); font-size: 12px; }
      .course-menu {
        position: absolute;
        left: 0;
        bottom: 84px;
        z-index: 20;
        display: none;
        width: 418px;
        padding: 16px;
        background: rgba(255,255,255,.98);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 24px 64px rgba(15, 23, 42, 0.18);
      }
      .course-menu::after {
        content: "";
        position: absolute;
        left: 34px;
        bottom: -8px;
        width: 14px;
        height: 14px;
        background: rgba(255,255,255,.98);
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        transform: rotate(45deg);
      }
      body[data-screen="course-switch"] .course-menu { display: block; }
      .course-menu h3 { margin: 2px 4px 12px; color: var(--ink); font-size: 17px; }
      .course-group-title {
        display: flex; justify-content: space-between; margin: 12px 4px 8px;
        color: var(--muted); font-size: 12px; font-weight: 800;
      }
      .course-option {
        display: grid;
        grid-template-columns: 26px minmax(0,1fr) auto;
        gap: 10px;
        align-items: center;
        min-height: 56px;
        padding: 9px 10px;
        border-radius: 9px;
      }
      .course-option.active { background: #eaf8f6; outline: 1px solid rgba(14,166,154,.22); }
      .course-option strong, .course-option span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .course-option strong { color: var(--ink); font-size: 14px; }
      .course-option span { margin-top:3px; color: var(--muted); font-size:12px; }

      .main { display: grid; grid-template-rows: var(--top) minmax(0, 1fr); min-width: 0; background: #fbfdfe; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 0 32px 0 34px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(255,255,255,.96), rgba(241,250,249,.9));
      }
      .title h1 { margin: 0; color: var(--ink); font-size: 28px; font-weight: 880; }
      .title p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
      .account-zone {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        margin-left: auto;
      }
      .top-action, .account-chip {
        min-height: 46px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: 0 6px 18px rgba(15,23,42,.04);
      }
      .top-action { display:grid; place-items:center; width:46px; color:#42566c; }
      .account-chip {
        display: grid;
        grid-template-columns: 42px minmax(0,1fr) 18px;
        gap: 11px;
        align-items: center;
        width: 254px;
        padding: 5px 12px 5px 5px;
        border-color: rgba(14, 166, 154, 0.24);
      }
      .account-chip strong, .account-chip span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .account-chip strong { color: var(--ink); font-size:14px; font-weight:820; }
      .account-chip span { color: var(--muted); font-size:12px; margin-top:2px; }
      .content { min-width:0; height:100%; overflow:hidden; padding: 24px 32px 28px; }
      .page { height: 100%; min-width: 0; }

      .panel {
        min-width: 0;
        background: rgba(255,255,255,.98);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 26px rgba(24, 40, 63, 0.045);
      }
      .panel-head {
        display:flex; align-items:center; justify-content:space-between; gap:16px;
        min-height:58px; padding: 0 18px; border-bottom:1px solid var(--line);
      }
      .panel-head h2 { margin:0; color:var(--ink); font-size:20px; font-weight:880; }
      .panel-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
      .btn {
        display:inline-flex; align-items:center; justify-content:center; gap:7px;
        min-height:38px; padding:0 14px; color:var(--teal);
        background:#fff; border:1px solid rgba(14,166,154,.28); border-radius:7px;
        font-size:13px; font-weight:820; white-space:nowrap;
      }
      .btn.primary { color:#fff; background:var(--teal); border-color:var(--teal); }
      .tag {
        display:inline-flex; align-items:center; height:24px; padding:0 8px;
        color:var(--teal); background:#e8f8f5; border:1px solid rgba(14,166,154,.2);
        border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap;
      }
      .tag.blue { color:var(--blue); background:#edf4ff; border-color:#cfe0ff; }
      .tag.amber { color:#b45f12; background:#fff4e9; border-color:#ffd8b2; }
      .tag.green { color:#217a4d; background:#e9f8ef; border-color:#c9ecd7; }

      .home-grid {
        display:grid;
        grid-template-columns: minmax(0,1.35fr) 430px;
        grid-template-rows: auto minmax(0,1fr);
        gap:18px;
        height:100%;
      }
      .course-hero {
        grid-column:1 / -1;
        display:grid;
        grid-template-columns: minmax(0,1fr) 720px;
        min-height:178px;
        overflow:hidden;
      }
      .hero-main {
        padding:24px 26px;
        background:
          linear-gradient(90deg, #f0fbfa, rgba(255,255,255,.95)),
          radial-gradient(circle at 10% 10%, rgba(14,166,154,.16), transparent 30%);
      }
      .hero-main h2 { margin:0; color:var(--ink); font-size:29px; font-weight:900; }
      .hero-main p { margin:10px 0 0; color:var(--muted); line-height:1.6; }
      .hero-actions { display:flex; gap:10px; margin-top:20px; }
      .metric-strip {
        display:grid;
        grid-template-columns: repeat(4, minmax(0,1fr));
        border-left:1px solid var(--line);
      }
      .metric {
        display:grid; align-content:center; gap:9px; padding:18px 20px;
        border-right:1px solid var(--line);
      }
      .metric:last-child { border-right:0; }
      .metric label { color:var(--muted); font-size:13px; font-weight:780; }
      .metric strong { color:var(--ink); font-size:26px; font-weight:900; }
      .bar { width:100%; height:7px; overflow:hidden; background:#e2ebf0; border-radius:999px; }
      .bar i { display:block; height:100%; width:72%; background:linear-gradient(90deg, var(--blue), var(--teal)); }
      .home-left, .home-right { display:grid; gap:18px; min-height:0; align-content:start; }
      .learning-map { padding:20px; min-height: 558px; }
      .map-track {
        display:grid;
        gap:0;
        margin-top:14px;
        border:1px solid var(--line);
        border-radius:9px;
        overflow:hidden;
      }
      .map-row {
        display:grid;
        grid-template-columns: 42px 112px minmax(0,1fr) auto 24px;
        gap:16px;
        align-items:center;
        min-height:78px;
        padding:14px 16px;
        background:#fff;
        border-bottom:1px solid var(--line);
      }
      .map-row:last-child { border-bottom:0; }
      .map-row.active { background:linear-gradient(90deg,#effbf9,#fff); box-shadow:inset 4px 0 0 var(--teal); }
      .num {
        display:grid; place-items:center; width:34px; height:34px;
        color:var(--teal); background:#e2f7f3; border:1px solid rgba(14,166,154,.24);
        border-radius:8px; font-weight:900;
      }
      .type { color:var(--teal); font-size:13px; font-weight:850; }
      .map-row h3, .task-row h3, .course-card h3, .tree-row strong, .message strong { margin:0; color:var(--ink); font-size:17px; font-weight:870; }
      .map-row p, .task-row p, .course-card p, .tree-row span, .message p { margin:5px 0 0; color:var(--muted); font-size:13px; line-height:1.45; }
      .route-strip {
        display:grid; grid-template-columns: repeat(4,minmax(0,1fr)); align-items:center;
        min-height:78px; padding:0 18px; gap:12px;
      }
      .route-node { display:grid; grid-template-columns:28px minmax(0,1fr); gap:8px; align-items:center; }
      .route-node strong { overflow:hidden; color:var(--ink); font-size:14px; text-overflow:ellipsis; white-space:nowrap; }
      .route-node span { color:var(--muted); font-size:12px; }
      .task-list, .suggest-list { display:grid; gap:0; padding:16px 18px 18px; }
      .task-row, .suggest-row {
        display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:14px; align-items:center;
        min-height:72px; padding:12px 0; border-bottom:1px solid var(--line);
      }
      .task-row:last-child, .suggest-row:last-child { border-bottom:0; }
      .suggest-row h3 { margin:0; color:var(--ink); font-size:16px; }
      .suggest-row p { margin:5px 0 0; color:var(--muted); font-size:13px; }

      .course-space {
        display:grid;
        grid-template-columns: 320px 350px minmax(0,1fr);
        gap:0;
        height:100%;
        border:1px solid var(--line);
        border-radius:10px;
        overflow:hidden;
        background:#fff;
      }
      .course-col, .tree-col {
        border-right:1px solid var(--line);
        min-width:0;
        background:#fbfdfe;
      }
      .col-head { min-height:66px; padding:16px 18px; border-bottom:1px solid var(--line); }
      .col-head h2 { margin:0; color:var(--ink); font-size:19px; }
      .tabs { display:flex; gap:20px; margin-top:15px; color:var(--muted); font-size:13px; font-weight:780; }
      .tabs span.active { color:var(--teal); border-bottom:2px solid var(--teal); padding-bottom:8px; }
      .search { margin:16px 18px; height:40px; padding:0 13px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:8px; }
      .course-list { display:grid; gap:10px; padding:0 18px 18px; }
      .course-card { min-height:86px; padding:14px; border:1px solid var(--line); border-radius:9px; background:#fff; }
      .course-card.active { background:#eefaf8; border-color:rgba(14,166,154,.35); }
      .tree-list { padding:14px 14px 18px; }
      .tree-row {
        display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center;
        min-height:38px; padding:0 9px; border-radius:7px;
      }
      .tree-row.active { color:var(--teal); background:#e8f8f5; }
      .reader { display:grid; grid-template-rows:auto auto minmax(0,1fr) 60px; min-width:0; }
      .reader-title { padding:20px 28px 12px; }
      .reader-title h2 { margin:0; color:var(--ink); font-size:25px; }
      .reader-meta { display:flex; gap:16px; margin-top:10px; color:var(--muted); font-size:13px; }
      .reader-tabs { display:flex; gap:34px; height:48px; padding:0 28px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:800; }
      .reader-tabs span { display:flex; align-items:center; }
      .reader-tabs .active { color:var(--teal); border-bottom:2px solid var(--teal); }
      .doc-area { display:grid; grid-template-columns:220px minmax(0,1fr); gap:30px; padding:26px 28px; overflow:hidden; }
      .toc { border:1px solid var(--line); border-radius:8px; padding:14px; color:var(--muted); font-size:13px; line-height:2; }
      .article h1 { margin:0 0 20px; color:var(--ink); font-size:28px; }
      .article h2 { margin:22px 0 10px; color:var(--ink); font-size:20px; }
      .article p, .article li { color:#43556b; line-height:1.75; }
      .doc-table { width:100%; border-collapse:collapse; margin-top:18px; font-size:14px; }
      .doc-table td, .doc-table th { padding:12px; border:1px solid var(--line); text-align:left; }
      .reader-foot { display:flex; justify-content:space-between; align-items:center; padding:0 28px; border-top:1px solid var(--line); }

      .builder {
        display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:18px; height:100%;
      }
      .source-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)) auto auto; gap:16px; }
      .source-card {
        display:grid; grid-template-columns:42px minmax(0,1fr) 20px; gap:14px; align-items:center;
        min-height:76px; padding:14px 18px; background:#fff; border:1px solid var(--line); border-radius:9px;
      }
      .source-card.active { border-color:var(--teal); background:#effaf8; }
      .pipeline {
        display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; padding:16px 18px;
      }
      .pipe { display:grid; grid-template-columns:32px minmax(0,1fr); gap:9px; align-items:center; min-height:54px; }
      .pipe strong { color:var(--ink); font-size:14px; }
      .pipe span { color:var(--muted); font-size:12px; }
      .builder-main { display:grid; grid-template-columns:360px minmax(0,1fr) 410px; gap:18px; min-height:0; }
      .upload-box {
        display:grid; place-items:center; min-height:190px; margin:18px; padding:20px;
        text-align:center; border:1px dashed rgba(14,166,154,.46); border-radius:10px; background:#f4fbfa;
      }
      .file-list, .chapter-table, .preview-list { display:grid; gap:8px; padding:0 18px 18px; }
      .file, .chapter, .slot {
        display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:10px; align-items:center;
        min-height:48px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff;
      }
      .chapter { grid-template-columns:42px minmax(0,1fr) 80px 68px 42px; }
      .chapter strong, .file strong, .slot strong { color:var(--ink); font-size:14px; }
      .chapter span, .file span, .slot span { color:var(--muted); font-size:12px; }

      .profile {
        display:grid; grid-template-columns: 390px minmax(0,1fr) 430px; gap:18px; height:100%;
      }
      .chat {
        display:grid; grid-template-rows:auto minmax(0,1fr) 58px; min-height:0;
      }
      .messages { display:grid; align-content:start; gap:12px; padding:18px; overflow:hidden; }
      .bubble {
        max-width:88%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
        color:#40546a; background:#fff; line-height:1.65; font-size:13px;
      }
      .bubble.me { justify-self:end; background:#e8f8f5; border-color:#ccebe6; color:#166d67; }
      .chat-input { display:grid; grid-template-columns:minmax(0,1fr) 42px; gap:10px; padding:10px 14px; border-top:1px solid var(--line); }
      .chat-input div { display:flex; align-items:center; padding:0 14px; color:var(--muted); background:#f7fbfc; border:1px solid var(--line); border-radius:8px; font-size:13px; }
      .profile-table { padding:18px; }
      .profile-row {
        display:grid; grid-template-columns:116px minmax(0,1fr) 110px; gap:16px; align-items:center;
        min-height:82px; padding:12px 0; border-bottom:1px solid var(--line);
      }
      .profile-row:last-child { border-bottom:0; }
      .profile-row h3 { margin:0; color:var(--ink); font-size:16px; }
      .profile-row p { margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.45; }
      .evidence-list { display:grid; gap:10px; padding:16px 18px; }
      .evidence { display:grid; grid-template-columns:70px minmax(0,1fr) auto; gap:12px; min-height:48px; align-items:center; }
      .evidence time { color:var(--muted); font-size:12px; }
      .radar-card { margin:0 18px 18px; padding:18px; border:1px solid var(--line); border-radius:9px; background:#fbfdfe; }
      .radar {
        display:grid; place-items:center; width:210px; height:160px; margin:4px auto 12px;
        background: radial-gradient(circle, rgba(14,166,154,.16) 0 34%, transparent 35%),
          radial-gradient(circle, transparent 0 55%, rgba(14,166,154,.18) 56% 57%, transparent 58%);
      }
      .radar::before {
        content:""; width:116px; height:116px; background:rgba(14,166,154,.18);
        clip-path:polygon(50% 4%,86% 26%,78% 78%,25% 89%,7% 36%);
        border:2px solid var(--teal);
      }

      .generation {
        display:grid; grid-template-columns:360px minmax(0,1fr) 430px; grid-template-rows:minmax(0,1fr) 176px; gap:18px; height:100%;
      }
      .settings { grid-row:1 / -1; }
      .set-list { display:grid; gap:10px; padding:16px 18px; }
      .set-item {
        min-height:58px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff;
      }
      .set-item.active { background:#effaf8; border-color:rgba(14,166,154,.36); }
      .set-item strong { display:block; color:var(--ink); font-size:14px; }
      .set-item span { display:block; margin-top:5px; color:var(--muted); font-size:12px; line-height:1.35; }
      .agent-chat { display:grid; grid-template-rows:auto minmax(0,1fr) 72px; min-height:0; }

      }

      function profiles() {
        return `<div class="profile"><section class="panel chat"><div class="panel-head"><div><h2>画像对话</h2><p>对话记录已自动保存</p></div></div><div class="messages">${['AI 助理：我会通过几个问题了解你的学习情况，帮你生成个性化学习画像。','你：我一般是看视频课程和做题，遇到问题会查资料。','AI 助理：在学习中，你觉得自己最擅长的模块是什么？','你：比较擅长计算机基础概念，但算法和代码调试弱一些。','AI 助理：你希望通过这门课程达到什么目标？','你：能独立完成课程任务，为后续课程打好基础。'].map((x,i)=>`<div class="bubble ${i%2?'me':''}">${x}</div>`).join('')}</div><div class="chat-input"><div>继续补充你的想法或问题...</div><button class="btn primary">发送</button></div></section>
        <section class="panel"><div class="panel-head"><div><h2>当前画像</h2><p>基于对话、测评、学习行为和教师证据构建</p></div><button class="btn primary">保存更新</button></div><div class="profile-table">${['知识基础|计算机基础概念理解较好，但编程语法与调试能力较弱。|72%','认知风格|偏好通过实例与图示理解，动手实践能带来更好效果。|68%','学习目标|希望掌握计算机基础，能独立完成编程任务。|95%','易错点|循环结构、数组边界和函数参数传递方面出错。|60%','时间约束|每周可投入 6-8 小时，周末学习时间更充裕。|80%'].map(x=>`<div class="profile-row"><h3>${x.split('|')[0]}</h3><p>${x.split('|')[1]}</p><div><strong>${x.split('|')[2]}</strong><div class="bar"><i style="width:${x.split('|')[2]}"></i></div></div></div>`).join('')}</div><div style="padding:0 18px 18px"><div class="bar"><i style="width:78%"></i></div></div></section>
        <section class="panel"><div class="panel-head"><div><h2>证据记录</h2><p>对话、测评、学习行为、教师证据</p></div><button class="btn">全部时间</button></div><div class="evidence-list">${['06/06|对话|回答学习方式与目标等问题','06/05|测评|计算机基础概念测验得分 85%','06/05|测评|编程基础测验得分 52%','06/04|学习行为|观看《C 语言循环结构详解》','06/04|教师证据|课堂提问表现较好，但代码实现需加强'].map(x=>`<div class="evidence"><time>${x.split('|')[0]}</time><span class="tag">${x.split('|')[1]}</span><strong>${x.split('|')[2]}</strong></div>`).join('')}</div><div class="radar-card"><h3>掌握度分布</h3><div class="radar"></div><div class="profile-row" style="grid-template-columns:1fr 120px;min-height:42px;padding:5px 0"><span>基础概念</span><strong>85%</strong></div><div class="profile-row" style="grid-template-columns:1fr 120px;min-height:42px;padding:5px 0"><span>数据结构</span><strong>55%</strong></div><div class="profile-row" style="grid-template-columns:1fr 120px;min-height:42px;padding:5px 0"><span>算法思维</span><strong>48%</strong></div></div></section></div>`;
      }

      function generation() {
        return `<div class="generation"><section class="panel settings"><div class="panel-head"><div><h2>生成设置</h2><p>选择课程、画像与资源类型</p></div></div><div class="set-list">${['工程实践与项目开发|64 学时 · 项目制课程','Java Web 应用开发与软件工程实践|48 学时','AI 个性化学习智能体实践|48 学时','大学计算机基础自适应训练|32 学时'].map((x,i)=>`<div class="set-item ${i===0?'active':''}"><strong>${x.split('|')[0]}</strong><span>${x.split('|')[1]}</span></div>`).join('')}<div class="set-item active"><strong>张同学的学习画像</strong><span>最近更新：今天 10:25</span></div><div class="set-item"><strong>资源类型</strong><span><span class="tag">课件 PPT</span> <span class="tag">实验指导书</span></span></div><div class="set-item"><strong>生成目标</strong><span>围绕“数据访问与持久化”生成配套课件和实验指导书，包含代码示例和思考题。</span></div><button class="btn primary" style="width:100%">运行生成</button></div></section>
        <section class="panel agent-chat"><div class="panel-head"><div><h2>资源生成</h2><p>智能体会自动规划并生成高质量学习资源</p></div><button class="btn">新建会话</button></div><div class="agent-body"><div class="agent-msg me">请基于《工程实践与项目开发》第3章数据访问与持久化，生成课件和实验指导书。</div><div class="agent-msg"><strong>AI 助教 10:30</strong><p>好的，我将基于课程内容与同学的学习画像，生成匹配的课件和实验指导书。</p></div><div class="run-card"><strong>已识别的生成计划</strong><p>课程上下文：数据访问与持久化；画像匹配：偏代码实操；资源类型：课件与实验指导书；预计时间：8-12 分钟。</p></div><div class="run-card"><strong>智能体已开始执行任务</strong><div class="run-flow"><span class="tag green">资料检索</span> → <span class="tag green">画像匹配</span> → <span class="tag blue">资源生成</span> → <span class="tag">内容审核</span> → <span class="tag">发布给学生</span></div></div></div><div class="agent-input"><div>继续补充生成要求，例如：加入更多实验步骤...</div><button class="btn primary">发送</button></div></section>
        <section class="panel orchestrator"><div class="panel-head"><div><h2>Agent 编排</h2><p>运行中</p></div><span class="tag green">运行中</span></div><div class="agent-steps">${['资料检索|正在检索课程教材、文档、代码与案例|4/5','画像匹配|已匹配学习画像与资源，调整内容深度|完成','资源生成|生成课件与实验指导书初稿|生成中','内容审核|检查准确性、结构与教学适配度|待执行','发布给学生|生成完成后可发布到课程空间|待执行'].map((x,i)=>`<div class="agent-step"><span class="num">${i<2?'✓':i+1}</span><div><strong>${x.split('|')[0]}</strong><p>${x.split('|')[1]}</p></div><span class="tag ${i<2?'green':i===2?'blue':''}">${x.split('|')[2]}</span></div>`).join('')}</div><button class="btn" style="margin:0 18px 18px">查看运行日志</button></section>
        <section class="panel task-table"><div class="panel-head"><div><h2>最近任务</h2><p>多样例保留，避免像单一演示数据</p></div><button class="btn">全部任务</button></div><table><tr><th>任务名称</th><th>课程</th><th>资源类型</th><th>状态</th><th>进度</th><th>审核状态</th><th>操作</th></tr><tr><td>第3章 数据访问与持久化 课件+实验指导书</td><td>工程实践与项目开发</td><td>课件、实验指导书</td><td><span class="tag blue">生成中</span></td><td>65%</td><td>-</td><td>查看</td></tr><tr><td>第2章 控制层开发 课件+实验指导书</td><td>Java Web 应用开发</td><td>课件、实验指导书</td><td><span class="tag green">已完成</span></td><td>100%</td><td><span class="tag green">已通过</span></td><td>预览</td></tr><tr><td>MyBatis 核心概念 题库</td><td>工程实践与项目开发</td><td>题库</td><td><span class="tag amber">审核中</span></td><td>-</td><td><span class="tag amber">待审核</span></td><td>查看</td></tr></table></section>
      </div>`;
      }

      function learning() {
        return `<div class="learning"><section class="panel"><div class="panel-head"><div><h2>当前上下文</h2><p>AI 只围绕当前课程和任务回答</p></div></div><div class="context-list">${['课程|工程实践与项目开发','任务|综合表达与证据引用 · 进行中','薄弱点|证据引用、项目报告表达','资料|课程讲义、实验指导、题库、画像记录'].map(x=>`<div class="context-item"><strong>${x.split('|')[0]}</strong><p>${x.split('|')[1]}</p></div>`).join('')}</div></section><section class="panel learning-main"><div class="panel-head"><div><h2>AI 助教对话</h2><p>聊天是主体，输入区始终可见</p></div><button class="btn">新会话</button></div><div class="messages"><div class="bubble">我已经读取当前课程节点。你现在处在“综合表达与证据引用”，建议先把项目背景、指标和证据链整理清楚。</div><div class="bubble me">我不太会把证据写进项目报告里。</div><div class="bubble">可以按“结论 - 证据 - 解释”的结构写。比如先说资源推荐效果提高，再引用完成率、答题正确率和追问次数，最后解释为什么这些指标能证明效果。</div><div class="bubble me">帮我生成一段可以直接放进报告的表述。</div><div class="bubble">可以。我会基于当前课程和你的画像，生成一段项目报告表述，并附一个指标表格。</div></div><div class="chat-input"><div>继续问：帮我生成报告表述和指标表格</div><button class="btn primary">发送</button></div></section><section class="panel"><div class="panel-head"><div><h2>可引用材料</h2><p>回答可插入学习记录</p></div></div><div class="context-list">${['课程讲义片段|资源推送与效果评估流程说明','错题关联|第 3 题：评价指标选择不完整','推荐追问|生成表格 / 做一次小测 / 输出报告段落','学习记录|最近 21 分钟学习行为可作为画像证据'].map(x=>`<div class="context-item"><strong>${x.split('|')[0]}</strong><p>${x.split('|')[1]}</p></div>`).join('')}</div></section></div>`;
      }

      const views = { dashboard:home, 'course-switch':home, courses, builder, profiles, generation, learning };
      document.querySelector('#page').innerHTML = views[screen]();
      document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icons[el.dataset.icon] || ''; });
    </script>
  </body>
</html>
